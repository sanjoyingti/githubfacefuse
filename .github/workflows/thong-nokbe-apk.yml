# Builds the Thong Nokbe Gym Android APK on GitHub and publishes it as a
# GitHub Release, which gives a direct download link.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT – the Firebase service-account key (JSON). Needed to send the
#                          "update available" push notification to every phone.
#   GOOGLE_SERVICES_JSON – optional: overrides thong-nokbe/google-services.json (committed; it is not a secret).
#                          Without it a stand-in config is used: the APK installs and opens,
#                          but Google sign-in, chat, calls, attendance and fees won't work.
#
# Runs on every push that changes thong-nokbe/ (or this file), or manually from the Actions tab.
#
# Every successful build is sent to everyone as an update: each phone gets a notification (even with
# the app closed) and an update box when the app opens; "Update now" downloads and installs it in the app.
# The first line of the commit message is the "what's new" text. Put [no-update] in the commit
# message (or untick the box on a manual run) to build without telling anyone.
name: Thong Nokbe Gym APK

on:
  push:
    paths: ['thong-nokbe/**', '!thong-nokbe/**/*.md', '.github/workflows/thong-nokbe-apk.yml']
  workflow_dispatch:
    inputs:
      announce:
        description: Send update to everyone (notification + update box in the app)
        type: boolean
        default: true
      notes:
        description: What's new (shown to members)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: thong-nokbe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: thong-nokbe
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      NODE_ENV: production
      # Baked into the app so it knows its own version (and Android's versionCode grows each build).
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thong-nokbe/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Install
        run: |
          npm ci --legacy-peer-deps
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "CONFIG=firebase" >> "$GITHUB_ENV"
          elif [ -f google-services.json ]; then
            echo "Using the google-services.json committed in the repo."
            echo "CONFIG=firebase" >> "$GITHUB_ENV"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: building a preview APK with a stand-in Firebase config (sign-in will not work)."
            cp scripts/placeholder-google-services.json google-services.json
            echo "CONFIG=preview" >> "$GITHUB_ENV"
          fi

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: thong-nokbe/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ThongNokbeGym.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ThongNokbeGym-apk
          path: thong-nokbe/ThongNokbeGym.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thong-nokbe-build-${{ github.run_number }}
          name: Thong Nokbe Gym — build ${{ github.run_number }}${{ env.CONFIG == 'preview' && ' (preview)' || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.CONFIG == 'preview' }}
          files: thong-nokbe/ThongNokbeGym.apk
          body: |
            Download **ThongNokbeGym.apk** below and open it on your Android phone (allow "Install unknown apps" when asked).
            ${{ env.CONFIG == 'preview' && '⚠️ Preview build: no Firebase config was set, so sign-in and the online features will not work yet. Add the GOOGLE_SERVICES_JSON secret and re-run to get the full app.' || '' }}

      - name: Update the permanent "latest" download link (used by invite links)
        if: env.CONFIG == 'firebase'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view thong-nokbe-latest >/dev/null 2>&1 || gh release create thong-nokbe-latest --title "Thong Nokbe Gym — latest" --notes "Always the newest Thong Nokbe Gym APK. Download ThongNokbeGym.apk below." --latest=false
          gh release upload thong-nokbe-latest ThongNokbeGym.apk --clobber

      - name: Send update to everyone (notification + in-app update box)
        if: env.CONFIG == 'firebase' && ((github.event_name == 'workflow_dispatch' && inputs.announce) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-update]')))
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BUILD: ${{ github.run_number }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/thong-nokbe-latest/ThongNokbeGym.apk
          INPUT_NOTES: ${{ inputs.notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then NOTES="$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | sed 's/\[[a-z-]*\]//g; s/^ *//; s/ *$//')"; fi
          export NOTES
          node -e 'const fs=require("fs");fs.writeFileSync("version.json",JSON.stringify({build:Number(process.env.BUILD),notes:process.env.NOTES,url:process.env.APK_URL})+"\n")'
          cat version.json
          gh release upload thong-nokbe-latest version.json --clobber
          node scripts/announce-update.mjs
