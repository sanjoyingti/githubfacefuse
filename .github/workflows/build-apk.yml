# Builds the FaceFusion Mobile APK on GitHub's servers and publishes it as a Release, so it
# can be downloaded from the repository's Releases page without Android Studio.
#
# Runs when this file changes on a push, and on demand: Actions tab -> "Build APK release"
# -> Run workflow. Each run creates a new release tagged v0.9.41-motion-<run number>.
name: Build APK release

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: facefusion-mobile/work/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      # The Qualcomm AI Runtime zip (~2.3 GB) the build downloads once; cached between runs.
      - uses: actions/cache@v4
        with:
          path: facefusion-mobile/work/android/.qairt-cache
          key: qairt-2.49.0.260730

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      # Always available, even if releases cannot be created: the APK as a downloadable
      # artifact on the run's page (Actions tab -> the run -> Artifacts).
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-0.9.41-motion-apk
          path: facefusion-mobile/work/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Needs "Read and write permissions" for workflows (Settings -> Actions -> General ->
      # Workflow permissions). If that is set to read-only, this step is skipped with a
      # warning instead of failing the build; the artifact above still has the APK.
      - name: Publish the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.9.41-motion-${GITHUB_RUN_NUMBER}"
          apk="FaceFusion-0.9.41-motion.apk"
          cp app/build/outputs/apk/debug/*.apk "$apk"
          cat > notes.md <<'NOTES'
          FaceFusion Mobile 0.9.41 with the occlusion mask (food, hands and cups in front of the face stay as filmed), "keep original mouth inside", fading the swap out on big head turns, motion smoothing for video/Live and rotated-face detection. The switches are under the gear on the face_swapper chip.

          **How to install:** download `FaceFusion-0.9.41-motion.apk` below on your Android phone, tap it, allow installing from this source if Android asks, then tap Install. It appears as "FaceFusion Debug" next to any existing FaceFusion app. Needs a 64-bit (arm64) phone with Android 12 or newer.

          On first launch the app downloads its face models (Settings -> Models).

          To check the masks are working: gear on the face_swapper chip -> Face masker. Under the switches a blue status line says whether the occlusion model and the face parser are running, on the GPU or the CPU, or why not. It fills in after the first preview or swap.

          Build 35 adds **sanjoyingti.zip** below: the Android Studio project on its own, in a short folder named sanjoyingti, so Windows extracts every file (the long paths in the repository zip made Windows drop files, including the photos panel). Extract it to C:\\, open C:\\sanjoyingti in Android Studio, Build > Build APK(s). Settings > About then shows build35.

          Build 34 shows its build number: Settings -> About now reads "0.9.41-mic-debug-build34", and every bug report names the build, so you can always see which version is installed. A copy compiled from this source zip shows the same number.

          Build 33: a clear "More photos of Source N (1 of 3)" button right under the face row opens the photos panel (it was only a small + in the source pane and a second tap on the selected face).

          Build 32 runs cooler and saves battery, same results and settings: the AI chip is no longer held at full power while the app is just open (after a preview or a swap it used to stay pinned at maximum voltage, unable to sleep deeply); it goes to full power only for the frame being swapped, and stays there only while Live or the player is running. During a long swap it switches to its balanced mode at the first sign of warmth instead of waiting until the phone is already warm. The thread pool that replaced the crashing one sleeps between frames instead of spinning.

          Build 31 never throws swapped work away: Stop keeps every frame swapped so far and Continue starts at the very next frame (before, the piece in progress was swapped again); pressing Swap with an unfinished swap of the same video offers Continue instead of starting over, and on another video asks before replacing it; a video that finished in the background after the app was closed is shown again when you reopen the app.

          Build 30 makes Continue dependable: progress is saved every 2 seconds of video (was 5), an unfinished swap is offered even if it stopped before the first save, the app's copy of the video is kept outside the cache (which Android and cleaner tools empty), and a "Continue unfinished swap" button stays on the Swap screen until it is finished or a new swap replaces it. Continue carries on from the last save and gives you the whole video.

          Build 29 is faster with the same result, and comes set up:
          - Reading the video, swapping on the AI chip and saving the video now run at the same time instead of one after another, so the AI chip no longer waits for the file. Same frames, same order, same output.
          - Ready-made settings on a new install: 512 pixel boost, occlusion mask, real mouth inside, skin-tone matching, expression restorer 80, face enhancer 50 (once its model is downloaded), head-turn fade, motion smoothing, Smart speed, Faster masks, Fast video 2, output 30 fps and 4K clips at 1080p. Settings you saved before are kept; Output settings -> source size for full 4K.
          - Safer: the error text shared between threads is now guarded, and the video stages always stop before the video tools are closed.

          Build 28 makes the extra photos angle-aware: for every frame and every face, the photo whose head angle is closest to that face's counts most (a face turned left uses mostly your left-turned photo), blending smoothly as the head turns so there is no flicker, while every photo keeps a share of the identity. No extra memory or time.

          Build 27 adds up to 3 photos of the same person per source face, combined into one likeness for a steadier face on head turns and in different light. On the Swap screen: the + button in the source pane, or tap the selected face again. Each photo is content-checked like the main one, a photo of a different person is refused, and the combining happens once before the swap, so swapping is not slower. A face with one photo works exactly as before.

          Build 26: only the face swapper you have selected is required. Before, hyperswap 1a was always downloaded as required, even when you used 1b or 1c and had deleted 1a to save space.

          Build 25 removes the part that kept crashing: the CPU thread library (LLVM OpenMP) that the mask models used is gone from the app. Its start-up stopped the app on Android 17 when the phone switched CPU cores off to save power, and no setting avoided it. ncnn is now built from its official source with its own small thread pool instead. Same features, settings and results (mask outputs checked against the previous build, and under a memory-error checker: no errors, no leaks, also with both masks running at the same time).

          Build 24 reads 10-bit (HDR) videos correctly, such as 4K HDR clips from Samsung phones: before, their frames came out as noise and no face was found. It also contains build 23. Checked before release: the native swap code ran under a memory-error checker (AddressSanitizer) on 4K frames with 8 faces and every mask, mouth, colour, smart-speed and rotation option on, with no errors and no leaks.

          Build 23 fixes the crash that build 22 did not: the CPU thread library (OpenMP) built into the app was visible to the rest of the phone, so on Android 17 another copy of it in the same app process could take over its settings, and it then stopped the app while starting the masks. The app's native library now keeps all of it private and shows Android only its own functions. Build 22's extra thread setting, which made the same check fail another way, is removed.

          Build 22 fixes the crash in your bug report (a real crash this time, not memory): the CPU thread library inside the mask models aborted the app while starting up on Android 17 (OpenMP affinity setup). That setup is now switched off; the app never needed it. Smart speed also runs the face parser for "Keep original mouth inside" only while the mouth is open (and a few frames after), so videos with a closed mouth swap faster. Same result: tested byte-identical.

          Build 21 uses less memory while you use the app, too: the preview and the Live camera now load only the models your settings use (no lip syncer, face editor or enhancer unless they are switched on). Switching one of them on loads it then, which takes a few seconds the first time.

          Build 20 fixes the app closing by itself: the bug report showed Android stopping it for low memory, not a crash. During a swap the app now unloads the models your settings do not use (lip syncer, face editor, enhancer, when they are off), and when you leave the app while nothing is running it frees all models and reloads them when you come back. Same settings, same result. If a swap is still stopped, Continue picks it up.

          Build 19: the bug report now lists the crash location first (the app's own functions, the signal and the abort reason), so a crash can be fixed exactly.

          Build 18 adds Smart speed (Realism card, on by default): in videos the expression restorer runs only around blinks and closed eyes, and the masks are reused while nothing in front of the face changes. Faster and cooler; previews and photos always compute everything.

          Build 17 never changes your settings on its own: after a crash it only reloads your video (no settings are switched off), and the output frame rate and size you choose are kept for the next video.

          Build 16 is faster with the masks on: they run on the graphics chip while the AI chip swaps ("Faster masks" in Face Masker, on by default), and the expression restorer reuses the swap's masks instead of computing them a second time. Same result.

          Build 15 runs cooler and uses less battery during video swaps, with the same result: the NPU uses Qualcomm's sustained profile instead of burst for long runs (and its balanced profile when the phone is warm), the app eases off as soon as Android forecasts heat instead of waiting for it, and the mask models' CPU threads no longer spin between frames.

          Build 14 saves progress every 5 seconds of video (was 20), so Continue is offered even when the app is closed early in a long, slow swap. Build 13 added Continue: a video swap is saved in pieces as it runs, so if you stop it, close the app or it crashes, the next time you open the app it asks "Continue unfinished swap?" and carries on from where it stopped. Lip-sync swaps keep the old single-run behaviour.

          Builds 9 and 10 (crash fixes, safe mode, delete guard, background and battery fixes) are included in this build; they were built but not published because releases were blocked at the time.

          Build 10: the app can only ever delete its own private working files (a hard guard on every delete; your photos and videos are only read, never changed or deleted), long runs stop cleanly at Android's 6-hour background limit instead of crashing, the wake lock covers runs up to 12 hours, and the live preview picture is skipped while the app is in the background to save battery.

          Build 9 fixed the crash when a target video is added or a swap starts: the pipeline can no longer be released or reloaded while a preview frame is still running (one lock around every native call), the parallel mask thread from build 7 is removed, native errors now show as a message instead of closing the app, and after any crash the app restarts in safe mode with your last video reloaded.

          Build 8 keeps swapping in the background (notification with progress and Cancel, works with the screen off), slows down instead of overheating, checks content only over the trimmed part with small frames (much quicker start, less memory), and tells you on the next start why the app closed if it ever does.

          Build 7 made it faster: the mask models run at the same time as the swap (GPU beside the NPU) and use faster GPU maths, and the Realism card has a one-tap "Fast" preset next to "Most realistic". For 60 fps videos, set Output settings to 30 fps.

          Build 6 added a Realism card at the top of the gear dialog: a one-tap "Most realistic" preset, skin-tone matching, and the expression restorer (puts the original closed eyes, blinks and mouth shape back on the swapped face; needs the face editor models from Settings, Models).

          The content check is ON, as in the original app: photos and videos flagged as nudity are refused before any processing.

          Not yet tested on a phone; built automatically from this commit.
          NOTES
          # The Android Studio project alone, under a SHORT top folder ("sanjoyingti"), so
          # Windows' Extract All stays far below its 260-character path limit (the
          # repository zip nests it four folders deeper and long paths were dropped).
          # Self-contained: the project reads nothing outside work/android. BUILD_NUMBER
          # is this run's, so Settings > About names the same build as the release.
          rm -rf /tmp/sz && mkdir -p /tmp/sz
          git -C "$GITHUB_WORKSPACE" archive --format=tar --prefix=sanjoyingti/ \
            HEAD:facefusion-mobile/work/android | tar -x -C /tmp/sz
          echo "$GITHUB_RUN_NUMBER" > /tmp/sz/sanjoyingti/BUILD_NUMBER
          (cd /tmp/sz && zip -qr sanjoyingti.zip sanjoyingti)
          cp /tmp/sz/sanjoyingti.zip sanjoyingti.zip
          gh release create "$tag" "$apk" sanjoyingti.zip \
            --target "$GITHUB_SHA" \
            --title "FaceFusion Mobile 0.9.41 + occlusion & motion (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
